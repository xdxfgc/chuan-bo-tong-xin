<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="gFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1100" height="760" fill="#F8FAFC"/>

  <text x="550" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E293B">靠泊辅助 · 处理链与分级告警</text>
  <text x="550" y="72" text-anchor="middle" font-size="14" fill="#64748B">原始距离 → 滤波 → 速度拟合 → 分级告警 → 靠妥判定 → 电机联锁</text>

  <!-- ===== 处理链（上半部分）===== -->
  <g font-size="12" fill="#1E293B">
    <!-- 原始激光 -->
    <rect x="30" y="100" width="130" height="60" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" filter="url(#sh)"/>
    <text x="95" y="124" text-anchor="middle" font-weight="bold" fill="#075985">激光原始距离</text>
    <text x="95" y="144" text-anchor="middle" font-size="10" fill="#0369A1">船头 / 右舷 两路</text>

    <text x="160" y="132" font-size="16">→</text>

    <!-- 中值 -->
    <rect x="180" y="100" width="110" height="60" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" filter="url(#sh)"/>
    <text x="235" y="124" text-anchor="middle" font-weight="bold" fill="#075985">3 点中值</text>
    <text x="235" y="144" text-anchor="middle" font-size="10" fill="#0369A1">去野值</text>

    <text x="290" y="132" font-size="16">→</text>

    <!-- 平均 -->
    <rect x="310" y="100" width="110" height="60" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" filter="url(#sh)"/>
    <text x="365" y="124" text-anchor="middle" font-weight="bold" fill="#075985">8 点平均</text>
    <text x="365" y="144" text-anchor="middle" font-size="10" fill="#0369A1">压噪声</text>

    <text x="420" y="132" font-size="16">→</text>

    <!-- 滤波距离 -->
    <rect x="440" y="100" width="110" height="60" rx="8" fill="#DBEAFE" stroke="#6366F1" stroke-width="1.5" filter="url(#sh)"/>
    <text x="495" y="124" text-anchor="middle" font-weight="bold" fill="#3730A3">滤波距离</text>
    <text x="495" y="144" text-anchor="middle" font-size="10" fill="#4338CA">网页显示</text>

    <text x="550" y="132" font-size="16">→</text>

    <!-- 拟合 -->
    <rect x="570" y="100" width="130" height="60" rx="8" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.5" filter="url(#sh)"/>
    <text x="635" y="124" text-anchor="middle" font-weight="bold" fill="#3730A3">最小二乘拟合</text>
    <text x="635" y="144" text-anchor="middle" font-size="10" fill="#4338CA">8 点 × 50ms = 0.4s</text>

    <text x="700" y="132" font-size="16">→</text>

    <!-- 速度 -->
    <rect x="720" y="100" width="110" height="60" rx="8" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.5" filter="url(#sh)"/>
    <text x="775" y="124" text-anchor="middle" font-weight="bold" fill="#5B21B6">接近速度</text>
    <text x="775" y="144" text-anchor="middle" font-size="10" fill="#6D28D9">正 = 靠近</text>

    <text x="830" y="132" font-size="16">→</text>

    <!-- 告警判定 -->
    <rect x="850" y="100" width="220" height="60" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" filter="url(#sh)"/>
    <text x="960" y="124" text-anchor="middle" font-weight="bold" fill="#991B1B">告警判定（带滞回去抖）</text>
    <text x="960" y="144" text-anchor="middle" font-size="10" fill="#B91C1C">连续 3 帧满足才置位</text>
  </g>

  <!-- 说明：为什么要滤波 -->
  <rect x="30" y="175" width="1040" height="40" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1"/>
  <text x="550" y="200" text-anchor="middle" font-size="12" fill="#9A3412">为什么必须滤波：激光噪声 ±5mm，直接相邻两帧求差会得到 0.1 m/s 的假速度，而提醒阈值才 0.15，噪声就能刷满告警</text>

  <!-- ===== 分级告警表 ===== -->
  <text x="550" y="248" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E293B">三级告警（带滞回）</text>

  <!-- 0x01 -->
  <rect x="60" y="265" width="310" height="130" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#sh)"/>
  <text x="215" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400E">0x01 提醒级</text>
  <line x1="80" y1="302" x2="350" y2="302" stroke="#F59E0B" stroke-opacity="0.4"/>
  <text x="215" y="322" text-anchor="middle" font-size="12" fill="#78350F">触发：速度 &gt; 0.15 m/s</text>
  <text x="215" y="340" text-anchor="middle" font-size="12" fill="#78350F">解除：速度 &lt; 0.13 m/s</text>
  <text x="215" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">蜂鸣器两短声 · 限速 10%</text>
  <text x="215" y="376" text-anchor="middle" font-size="11" fill="#A16207">语音"靠泊速度偏大"</text>

  <!-- 0x02 -->
  <rect x="395" y="265" width="310" height="130" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#991B1B">0x02 严重级</text>
  <line x1="415" y1="302" x2="685" y2="302" stroke="#EF4444" stroke-opacity="0.4"/>
  <text x="550" y="322" text-anchor="middle" font-size="12" fill="#7F1D1D">触发：速度 &gt; 0.30 m/s</text>
  <text x="550" y="340" text-anchor="middle" font-size="12" fill="#7F1D1D">解除：速度 &lt; 0.27 m/s</text>
  <text x="550" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#991B1B">蜂鸣器急促 · 立即刹车</text>
  <text x="550" y="376" text-anchor="middle" font-size="11" fill="#B91C1C">语音"靠泊速度过大"· 拒绝油门</text>

  <!-- 0x03 -->
  <rect x="730" y="265" width="310" height="130" rx="10" fill="#FECACA" stroke="#DC2626" stroke-width="2.5" filter="url(#sh)"/>
  <text x="885" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#7F1D1D">0x03 严重级（距岸过近）</text>
  <line x1="750" y1="302" x2="1020" y2="302" stroke="#DC2626" stroke-opacity="0.4"/>
  <text x="885" y="322" text-anchor="middle" font-size="12" fill="#7F1D1D">触发：距离 &lt; 0.50m 且速度 &gt; 0.10</text>
  <text x="885" y="340" text-anchor="middle" font-size="12" fill="#7F1D1D">解除：距离 &gt; 0.55m 或速度 &lt; 0.09</text>
  <text x="885" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#7F1D1D">蜂鸣器急促 · 立即刹车</text>
  <text x="885" y="376" text-anchor="middle" font-size="11" fill="#991B1B">语音"距岸过近"· 拒绝油门</text>

  <!-- ===== 靠妥判定 ===== -->
  <text x="550" y="430" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E293B">靠妥判定（四道防护缺一不可）</text>

  <g font-size="11">
    <rect x="60" y="448" width="235" height="70" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="177" y="470" text-anchor="middle" font-weight="bold" fill="#065F46">① 拟合窗填满</text>
    <text x="177" y="488" text-anchor="middle" fill="#047857">8 点 = 0.4 秒</text>
    <text x="177" y="504" text-anchor="middle" fill="#059669">速度才算准</text>

    <rect x="305" y="448" width="235" height="70" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="422" y="470" text-anchor="middle" font-weight="bold" fill="#065F46">② 观察窗攒够</text>
    <text x="422" y="488" text-anchor="middle" fill="#047857">32 点 ≈ 1.6 秒</text>
    <text x="422" y="504" text-anchor="middle" fill="#059669">极差 &lt; 0.08m</text>

    <rect x="550" y="448" width="235" height="70" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="667" y="470" text-anchor="middle" font-weight="bold" fill="#065F46">③ 进入监测满 2 秒</text>
    <text x="667" y="488" text-anchor="middle" fill="#047857">BERTH_MIN_WATCH_MS</text>
    <text x="667" y="504" text-anchor="middle" fill="#059669">防开机误判</text>

    <rect x="795" y="448" width="245" height="70" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="917" y="470" text-anchor="middle" font-weight="bold" fill="#065F46">④ 实际接近过 0.30m</text>
    <text x="917" y="488" text-anchor="middle" fill="#047857">BERTH_APPROACH_MIN_M</text>
    <text x="917" y="504" text-anchor="middle" fill="#059669">没靠近过不算靠妥</text>
  </g>

  <!-- 靠妥条件汇总 -->
  <rect x="60" y="535" width="980" height="50" rx="8" fill="#065F46"/>
  <text x="550" y="560" text-anchor="middle" font-size="14" font-weight="bold" fill="#D1FAE5">靠妥 = 四道防护全过  +  距离 &lt; 1.0m  +  速度 &lt; 0.03 m/s  +  极差 &lt; 0.08m</text>
  <text x="550" y="578" text-anchor="middle" font-size="11" fill="#A7F3D0">语音播报"靠泊完成" · 蜂鸣器停 · OLED 显示"靠妥"</text>

  <!-- ===== 数据源选择 ===== -->
  <rect x="60" y="605" width="480" height="125" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="300" y="630" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E40AF">数据源自动选择（侧靠优先）</text>
  <text x="300" y="652" text-anchor="middle" font-size="12" fill="#1E3A8A">右舷进入靠泊区（≤3.5m）→ 用右舷</text>
  <text x="300" y="670" text-anchor="middle" font-size="12" fill="#1E3A8A">右舷看不到岸 → 退回船头</text>
  <text x="300" y="688" text-anchor="middle" font-size="12" fill="#1E3A8A">切换时结束本次监测，当新事件重开</text>
  <text x="300" y="708" text-anchor="middle" font-size="11" fill="#64748B">进入 3.5m / 退出 3.8m（滞回 0.3m，防抖）</text>

  <!-- 退出与重开 -->
  <rect x="560" y="605" width="480" height="125" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/>
  <text x="800" y="630" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532D">退出监测与重开</text>
  <text x="800" y="652" text-anchor="middle" font-size="12" fill="#166534">距离 &gt; 3.8m 持续 3 秒 → 结束</text>
  <text x="800" y="670" text-anchor="middle" font-size="12" fill="#166534">测距丢失 2 秒 → 结束</text>
  <text x="800" y="688" text-anchor="middle" font-size="12" fill="#166534">靠妥后又离开（&gt;1.5m 持续1s）→ 恢复监测</text>
  <text x="800" y="708" text-anchor="middle" font-size="11" fill="#64748B">距离曲线每秒 1 点，90 点 = 最近 1.5 分钟</text>

  <text x="550" y="750" text-anchor="middle" font-size="11" fill="#94A3B8">※ 落水告警期间靠泊语音让位，但判断/屏幕/蜂鸣器照常 · 靠妥/进入监测播报不被跳过</text>
</svg>
